spring.application.name=sentinel-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sentinel
spring.datasource.username=sentinel
spring.datasource.password=sentinel

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Offline detection
# 90 seconds is three missed 30 second agent cycles
sentinel.offline.threshold-seconds=90
sentinel.offline.check-interval-ms=30000

# Security
sentinel.security.jwt-secret=${SENTINEL_JWT_SECRET:}
sentinel.security.jwt-ttl-seconds=${SENTINEL_JWT_TTL_SECONDS:28800}
sentinel.security.enrollment-key=${SENTINEL_ENROLLMENT_KEY:}
sentinel.security.admin-username=${SENTINEL_ADMIN_USERNAME:}
sentinel.security.admin-password=${SENTINEL_ADMIN_PASSWORD:}

# Login throttling (in memory, per API instance)
sentinel.security.throttle.max-username-attempts=5
sentinel.security.throttle.max-ip-attempts=20
sentinel.security.throttle.window-minutes=15
sentinel.security.throttle.max-entries=10000