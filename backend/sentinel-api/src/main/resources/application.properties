spring.application.name=sentinel-api

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sentinel
spring.datasource.username=sentinel
spring.datasource.password=sentinel

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Offline detection
# 90 seconds is three missed 30 second agent cycles
sentinel.offline.threshold-seconds=90
sentinel.offline.check-interval-ms=30000