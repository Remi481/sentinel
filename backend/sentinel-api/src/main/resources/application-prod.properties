# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.
# Local development keeps the defaults in application.properties.

# Datasource: production values come from the environment, never from a file.
spring.datasource.url=${SENTINEL_DB_URL:jdbc:postgresql://db:5432/sentinel}
spring.datasource.username=${SENTINEL_DB_USER:sentinel}
# No default on purpose: a missing password must fail, not fall back to a weak one.
spring.datasource.password=${SENTINEL_DB_PASSWORD}

# Do not log SQL and do not keep a JPA session open while rendering a response.
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Trust the reverse proxy (Caddy) so the real client address reaches the API.
server.forward-headers-strategy=framework

# Finish in-flight requests before shutting down.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
