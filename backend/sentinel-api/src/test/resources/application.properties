# Test configuration: run against an in-memory H2 database so that tests do not
# need a PostgreSQL instance. This file lives on the test classpath, so it
# overrides the main application.properties while tests run.
spring.datasource.url=jdbc:h2:mem:sentinel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Keep the offline checker quiet while tests run so it never interferes.
sentinel.offline.threshold-seconds=90
sentinel.offline.check-interval-ms=3600000

# Fixed security values so tests can authenticate without environment variables.
sentinel.security.jwt-secret=test-secret-test-secret-test-secret-test-secret!
sentinel.security.jwt-ttl-seconds=3600
sentinel.security.enrollment-key=test-enrollment-key-1234567890abcdef
sentinel.security.admin-username=test-admin
sentinel.security.admin-password=test-admin-password-1234